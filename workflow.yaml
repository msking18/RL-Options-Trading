main:
  params: [args]
  steps:
    - init:
        assign:
          - project_id: "rl-options-training"
          - location: "us-central1"
          - training_job_name: "rl-options-train"
          - eval_job_name: "rl-options-eval"
          - report_job_name: "rl-options-report"

    - trigger_training:
        call: http.post
        args:
          url: ${"https://" + location + "-run.googleapis.com/apis/run.googleapis.com/v1/namespaces/" + project_id + "/jobs/" + training_job_name + ":run"}
          auth:
            type: OAuth2
        result: training_trigger_response

    - wait_for_training:
        assign:
          - training_execution_name: ${training_trigger_response.body.metadata.name}
        next: poll_training

    - poll_training:
        call: http.get
        args:
          url: ${"https://" + location + "-run.googleapis.com/apis/run.googleapis.com/v1/namespaces/" + project_id + "/executions/" + training_execution_name}
          auth:
            type: OAuth2
        result: training_status_response
        next: check_training_status

    - check_training_status:
        switch:
          - condition: ${not("completionTime" in training_status_response.body.status)}
            next: sleep_training
          - condition: ${training_status_response.body.status.conditions[0].status == "True"}
            next: trigger_evaluation
        next: training_failed

    - sleep_training:
        call: sys.sleep
        args:
          seconds: 60
        next: poll_training

    - training_failed:
        raise: ${"Training job failed: " + training_execution_name}

    - trigger_evaluation:
        call: http.post
        args:
          url: ${"https://" + location + "-run.googleapis.com/apis/run.googleapis.com/v1/namespaces/" + project_id + "/jobs/" + eval_job_name + ":run"}
          auth:
            type: OAuth2
        result: eval_trigger_response
        next: wait_for_evaluation

    - wait_for_evaluation:
        assign:
          - eval_execution_name: ${eval_trigger_response.body.metadata.name}
        next: poll_evaluation

    - poll_evaluation:
        call: http.get
        args:
          url: ${"https://" + location + "-run.googleapis.com/apis/run.googleapis.com/v1/namespaces/" + project_id + "/executions/" + eval_execution_name}
          auth:
            type: OAuth2
        result: eval_status_response
        next: check_eval_status

    - check_eval_status:
        switch:
          - condition: ${not("completionTime" in eval_status_response.body.status)}
            next: sleep_evaluation
          - condition: ${eval_status_response.body.status.conditions[0].status == "True"}
            next: trigger_reporting
        next: eval_failed

    - sleep_evaluation:
        call: sys.sleep
        args:
          seconds: 30
        next: poll_evaluation

    - eval_failed:
        raise: ${"Evaluation job failed: " + eval_execution_name}

    - trigger_reporting:
        call: http.post
        args:
          url: ${"https://" + location + "-run.googleapis.com/apis/run.googleapis.com/v1/namespaces/" + project_id + "/jobs/" + report_job_name + ":run"}
          auth:
            type: OAuth2
        result: report_trigger_response
        next: end_pipeline

    - end_pipeline:
        return: "Pipeline triggered and coordinated successfully."
